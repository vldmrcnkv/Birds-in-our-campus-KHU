<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠퍼스의 새들</title>
    <style>
/* 1. 전체 배경 화면 - 세로 정렬 구조로 변경 */
    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background-color: #FFF5CC; 
        display: flex;
        flex-direction: column; /* ★ 요소를 위에서 아래로 쌓이게 변경 */
        align-items: center;    /* 가로 가운데 정렬 */
        overflow: hidden;
    }

/* 2. 지도를 감싸는 프레임 - 윗부분에만 여백 주기 */
    .map-box {
        position: relative;
        width: calc(100vw - 60px);
        height: calc(100vh - 90px); /* ★ 전체 높이(100vh)에서 윗여백(60px)만큼 뺀 크기 */
        margin-top: 60px;          /* ★ 윗부분에만 60px 만큼의 여백 생성 */
        border: 10px solid #77A341;
        border-radius: 0px; 
        background-color: #ffffff; 
        box-sizing: border-box; 
    }

        #map { width: 100%; height: 100%; border-radius: 0px; }

/* 3. 로고 그림 - 윗여백 공간 덕분에 초록선 위에 딱 걸쳐집니다 */
    .title-image {
        position: absolute;
        top: -90px; /* ★ 로고가 초록색 테두리 선 위에 반쯤 걸치도록 위로 올림 */
        left: 50%;
        transform: translateX(-50%); 
        height: 150px; /* 로고 크기 */
        z-index: 10; 
    }
        /* 오른쪽 아래 긴꼬리딱새 이미지 버튼 */
        .bird-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px; 
            height: 100px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .bird-button:hover { transform: scale(1.1); }
        .bird-button img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); }

        /* 팝업창 디자인 */
        #name-popup {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
            text-align: center;
            min-width: 260px;
            border: 2px solid #6b8e23;
        }

        .team-name { color: #6b8e23; font-weight: bold; font-size: 1.4em; margin-bottom: 12px; }
        .member-names { color: #444; font-size: 1em; margin: 0; line-height: 1.6; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #999; font-size: 20px; }
        
       /* 커스텀 팝업(오버레이) 디자인 */
    .bird-popup {
      position: relative;
      background: #ffffff;
      width: 260px; /* 팝업 너비 */
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
      box-sizing: border-box;
      text-align: center;
      margin-bottom: 25px; /* 마커 위로 띄우기 위한 여백 */
      z-index: 100;
    }
    /* 팝업 아래쪽 말풍선 꼬리 */
    .bird-popup::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      margin-left: -12px;
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
    }

    /* 엑스(X) 버튼 */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      padding: 0;
    }
    .close-btn:hover { color: #333; }

    /* 팝업 내부 텍스트 및 미디어 */
    .bird-popup img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 15px; /* X버튼과 안 겹치게 */
      margin-bottom: 10px;
    }
    .bird-popup h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #333;
    }
    /* 날짜 (초록글씨) */
    .bird-popup .date {
      display: block;
      color: #28a745;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .bird-popup p {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      word-break: keep-all;
    }
    .bird-popup audio {
      width: 100%;
      height: 35px;
      outline: none;
    }
    </style>
</head>

        var activeOverlay = null; // 현재 열려있는 팝업을 추적

     birdData.forEach(function(bird) {
            var position = new kakao.maps.LatLng(bird.lat, bird.lng);

             // ★ 2. 카카오맵 커스텀 마커 이미지 설정 부분
            var imageSrc = bird.markerImg; // 데이터에 적어둔 이미지 경로
            var imageSize = new kakao.maps.Size(40, 40); // 마커의 크기 (가로 40px, 세로 40px)
            var imageOption = { offset: new kakao.maps.Point(20, 40) }; // 마커가 땅에 닿는 지점 설정 (가로의 절반, 세로 끝)

            // 카카오 마커 이미지 객체 생성
            var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);

            // 3. 마커 생성할 때 image 옵션 추가
            var marker = new kakao.maps.Marker({
                position: position,
                map: map,
                image: markerImage // ★ 이 줄이 추가되어 기본 핀 대신 지정한 그림이 뜹니다!
            });

            // 마커 객체에 종(species) 정보 저장
            marker.species = bird.species;
            markers.push(marker);

            // 팝업(오버레이)에 들어갈 HTML 요소 생성
            var contentWrap = document.createElement('div');
            contentWrap.className = 'bird-popup';
            
            contentWrap.innerHTML = `
                <button class="close-btn" title="닫기">✖</button>
                <img src="${bird.img}" alt="${bird.name}">
                <h3>${bird.name}</h3>
                <span class="date">${bird.date}</span>
                <p>${bird.desc}</p>
                <audio controls src="${bird.audio}"></audio>
            `;

            var customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: contentWrap,
                yAnchor: 1, 
                zIndex: 3
            });

            // X 버튼 클릭 이벤트
            var closeBtn = contentWrap.querySelector('.close-btn');
            closeBtn.onclick = function() {
                customOverlay.setMap(null);
                markers.forEach(function(m) { m.setOpacity(1); }); // 모든 마커 투명도 원상복구
            };

            // 3. 마커 클릭 이벤트: 팝업 열기 & 같은 종 강조 효과
            kakao.maps.event.addListener(marker, 'click', function() {
                if (activeOverlay) {
                    activeOverlay.setMap(null); // 기존 팝업 닫기
                }
                
                customOverlay.setMap(map); // 새 팝업 열기
                activeOverlay = customOverlay;

                // 클릭한 새와 같은 종은 선명하게(1), 다른 종은 투명하게(0.3)
                markers.forEach(function(m) {
                    if (m.species === marker.species) {
                        m.setOpacity(1);
                    } else {
                        m.setOpacity(0.3);
                    }
                });
            });
        });

        // 4. 지도 빈 공간 클릭 시 팝업 닫기
        kakao.maps.event.addListener(map, 'click', function() {
            if (activeOverlay) {
                activeOverlay.setMap(null);
            }
            markers.forEach(function(m) { m.setOpacity(1); });
        });
    });

    function hideNamePopup() { document.getElementById('name-popup').style.display = 'none'; }
