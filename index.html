<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠퍼스의 새들</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #fafafa;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 메인 지도 박스 (화면 가장자리 1/18 여백) */
        .map-box {
            position: relative;
            width: calc(100% - (100% / 9));
            height: calc(100vh - (100vh / 9));
            border: 4px solid #6b8e23;
            border-radius: 20px;
            background-color: #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        #map { width: 100%; height: 100%; border-radius: 16px; }

        /* [수정] 제목 박스: 완전히 불투명한 흰색(#FFFFFF) */
        .title-area {
            position: absolute;
            top: -35px; 
            left: 50%;
            transform: translateX(-50%);
            background-color: #FFFFFF; /* 불투명한 흰색 */
            padding: 10px 40px;
            z-index: 10;
            text-align: center;
            border: 2px solid #6b8e23; /* 테두리와 색상 통일 */
            white-space: nowrap;
            border-radius: 10px;
        }

        .title-area h1 { font-size: 22px; color: #333; margin: 0; }
        .title-area h2 { font-size: 13px; color: #555; margin: 5px 0 0 0; font-weight: normal; }

        /* 오른쪽 아래 긴꼬리딱새 이미지 버튼 */
        .bird-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px; 
            height: 100px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .bird-button:hover { transform: scale(1.1); }
        .bird-button img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); }

        /* 팝업창 디자인 */
        #name-popup {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
            text-align: center;
            min-width: 260px;
            border: 2px solid #6b8e23;
        }

        .team-name { color: #6b8e23; font-weight: bold; font-size: 1.4em; margin-bottom: 12px; }
        .member-names { color: #444; font-size: 1em; margin: 0; line-height: 1.6; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #999; font-size: 20px; }
        
       /* 커스텀 팝업(오버레이) 디자인 */
    .bird-popup {
      position: relative;
      background: #ffffff;
      width: 260px; /* 팝업 너비 */
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
      box-sizing: border-box;
      text-align: center;
      margin-bottom: 25px; /* 마커 위로 띄우기 위한 여백 */
    }
    /* 팝업 아래쪽 말풍선 꼬리 */
    .bird-popup::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      margin-left: -12px;
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
    }

    /* 엑스(X) 버튼 */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      padding: 0;
    }
    .close-btn:hover { color: #333; }

    /* 팝업 내부 텍스트 및 미디어 */
    .bird-popup img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 15px; /* X버튼과 안 겹치게 */
      margin-bottom: 10px;
    }
    .bird-popup h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #333;
    }
    /* 날짜 (초록글씨) */
    .bird-popup .date {
      display: block;
      color: #28a745;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .bird-popup p {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      word-break: keep-all;
    }
    .bird-popup audio {
      width: 100%;
      height: 35px;
      outline: none;
    }
    </style>
</head>
<body>

    <div class="map-box">
        <!-- 제목 영역 -->
        <div class="title-area">
            <h1>캠퍼스의 새들</h1>
            <h2>조류를 통해 자연을 만나다</h2>
        </div>

        <!-- 지도 영역 -->
        <div id="map"></div>

        <!-- 긴꼬리딱새 이미지 버튼 -->
        <div class="bird-button" onclick="showNamePopup()">
            <img src="https://raw.githubusercontent.com/vldmrcnkv/Birds-in-our-campus-KHU/main/%EA%B8%B4%EA%BC%AC%EB%A6%AC%EB%94%B1%EC%83%88%EC%9D%98%20%EA%B7%B8%EB%A6%BC.png" alt="긴꼬리딱새">
        </div>

        <!-- 팝업창 -->
        <div id="name-popup">
            <div class="close-btn" onclick="hideNamePopup()">×</div>
            <div class="team-name">긴꼬리딱새조</div>
            <p class="member-names">정유진 · 박지혜 · 김유진<br>이다빈 · 허준성</p>
        </div>
    </div>

    <!-- 카카오맵 API (HTTPS 명시) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4943ba2fc6952cf2d1e6afe9d646d32d"></script>
    
  
<script>
    // 1. 카카오맵 API가 로드된 후 실행
    kakao.maps.load(function() {
        var mapContainer = document.getElementById('map'); 
        if (!mapContainer) return;

        var mapOption = { 
            center: new kakao.maps.LatLng(37.596957, 127.051758), // 지도 중심 좌표
            level: 3 
        };
        
        var map = new kakao.maps.Map(mapContainer, mapOption);

        // --- 여기서부터 마커와 인포윈도우 설정 ---

       // 1. 관측한 새 데이터 배열 (여기에 데이터를 계속 추가하시면 됩니다)
        var birdData = [
            {
                species: 'oriental_magpie', // 같은 종을 묶어주는 핵심 키 (영문/숫자 조합 추천)
                name: '직박구리',
                lat: 37.596957, 
                lng: 127.051758,
                date: '2026-05-15',
                desc: '중앙도서관 근처에서 자주 우는 직박구리입니다.',
                // 작성하신 방식처럼 raw.githubusercontent.com 링크를 넣어주세요
                img: 'https://images.unsplash.com/photo-1552727451-6f4dd1fb9121?w=400', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
            },
            {
                species: 'oriental_magpie', // 위와 species가 같으므로 클릭 시 같이 강조됨
                name: '까치',
                lat: 37.598000, 
                lng: 127.053000,
                date: '2026-05-18',
                desc: '본관 앞 나무에서 관찰된 까치 무리입니다.',
                img: 'https://images.unsplash.com/photo-1552727451-6f4dd1fb9121?w=400',
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
            },
            {
                species: 'brown_eared_bulbul', 
                name: '직박구리',
                lat: 37.595500, 
                lng: 127.050500,
                date: '2026-05-20',
                desc: '시끄러운 소리로 울며 열매를 먹고 있는 직박구리.',
                img: 'https://images.unsplash.com/photo-1618331835717-801e976710b2?w=400',
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
            }
        ];

        var markers = [];
        var activeOverlay = null; // 현재 열려있는 팝업을 추적

        // 2. 데이터 배열을 순회하며 마커와 팝업 생성
        birdData.forEach(function(bird) {
            var position = new kakao.maps.LatLng(bird.lat, bird.lng);

            // 마커 생성
            var marker = new kakao.maps.Marker({
                position: position,
                map: map
            });
            
            // 마커 객체에 종(species) 정보 숨겨두기 (나중에 비교할 때 사용)
            marker.species = bird.species;
            markers.push(marker);

            // 팝업(오버레이)에 들어갈 HTML 요소 생성
            var contentWrap = document.createElement('div');
            contentWrap.className = 'bird-popup';
            
            // 요구하신 구성: 엑스버튼, 사진, 이름, 날짜(초록), 설명, 녹음
            contentWrap.innerHTML = `
                <button class="close-btn" title="닫기">✖</button>
                <img src="${bird.img}" alt="${bird.name}">
                <h3>${bird.name}</h3>
                <span class="date">${bird.date}</span>
                <p>${bird.desc}</p>
                <audio controls src="${bird.audio}"></audio>
            `;

            var customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: contentWrap,
                yAnchor: 1, // 마커 꼭대기에 팝업 꼬리가 오도록 설정
                zIndex: 3
            });

            // X 버튼 클릭 시 팝업 닫기 및 마커 투명도 복구
            var closeBtn = contentWrap.querySelector('.close-btn');
            closeBtn.onclick = function() {
                customOverlay.setMap(null);
                markers.forEach(function(m) { m.setOpacity(1); });
            };

            // 3. 마커 클릭 이벤트: 팝업 열기 & 같은 종 강조
            kakao.maps.event.addListener(marker, 'click', function() {
                // 이미 열려있는 팝업이 있다면 닫기
                if (activeOverlay) {
                    activeOverlay.setMap(null);
                }
                
                // 클릭한 마커의 팝업 띄우기
                customOverlay.setMap(map);
                activeOverlay = customOverlay;

                // 같은 종은 뚜렷하게(Opacity 1), 다른 종은 투명하게(Opacity 0.3)
                markers.forEach(function(m) {
                    if (m.species === marker.species) {
                        m.setOpacity(1);
                    } else {
                        m.setOpacity(0.3);
                    }
                });
            });
        });

        // 4. 지도의 빈 공간 클릭 시 팝업 닫기 및 투명도 복구
        kakao.maps.event.addListener(map, 'click', function() {
            if (activeOverlay) {
                activeOverlay.setMap(null);
            }
            markers.forEach(function(m) { m.setOpacity(1); });
        });
    });

    // 오른쪽 아래 새 이미지 클릭 시 뜨는 팀원 소개 팝업 함수
    function showNamePopup() { document.getElementById('name-popup').style.display = 'block'; }
    function hideNamePopup() { document.getElementById('name-popup').style.display = 'none'; }
</script>
    
</body>
</html>
